# .github/workflows/docker-build.yml
name: Docker build

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    name: Build and test Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and smoke test production images
        uses: ./.github/actions/build-production-images
