# .github/workflows/publish-images.yml
name: Publish container images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, test, and publish Docker images
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # --- Build and smoke test production images ---
      - name: Build and smoke test production images
        uses: ./.github/actions/build-production-images

      # --- Publish images to GHCR ---
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images
        run: |
          docker tag job-trackr-backend:test \
            ghcr.io/${{ github.repository_owner }}/job-trackr-backend:${{ github.sha }}

          docker tag job-trackr-backend:test \
            ghcr.io/${{ github.repository_owner }}/job-trackr-backend:latest

          docker tag job-trackr-frontend:test \
            ghcr.io/${{ github.repository_owner }}/job-trackr-frontend:${{ github.sha }}

          docker tag job-trackr-frontend:test \
            ghcr.io/${{ github.repository_owner }}/job-trackr-frontend:latest

      - name: Push SHA-tagged images
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/job-trackr-backend:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/job-trackr-frontend:${{ github.sha }}

      - name: Check whether commit is current main
        id: current-main
        shell: bash
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"

          echo "Workflow SHA: $GITHUB_SHA"
          echo "Current main SHA: $main_sha"

          if [ "$GITHUB_SHA" = "$main_sha" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update latest tags
        if: steps.current-main.outputs.is_current == 'true'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/job-trackr-backend:latest

          docker push \
            ghcr.io/${{ github.repository_owner }}/job-trackr-frontend:latest
