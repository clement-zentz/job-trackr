# .github/actions/build-production-images/action.yml
name: Build production images
description: Build and smoke test the production Docker images

runs:
  using: composite

  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build backend image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: false
        load: true
        tags: job-trackr-backend:test
        cache-from: type=gha,scope=backend
        cache-to: type=gha,mode=max,scope=backend

    - name: Build frontend image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: false
        load: true
        tags: job-trackr-frontend:test
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend

    - name: Smoke test production containers
      shell: bash
      run: bash .github/scripts/smoke-images.sh
